name: Test actions (PR)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-bootc-host-setup:
    name: Test bootc-host-setup (${{ matrix.runner }})
    # A matrix rather than one job per release: renovate bumps literal
    # runs-on values, which once left both jobs on 26.04 and the 24.04
    # package setup untested.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run bootc-host-setup
        id: setup
        uses: ./bootc-host-setup

      - name: Verify setup
        env:
          HOST_OS: ${{ steps.setup.outputs.host-os }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          just --version
          test -n "$ARCH"
          # The runner labels happen to match ID-VERSION_ID.
          test "$HOST_OS" = "$RUNNER_LABEL"

      - name: Verify basic requirements
        uses: ./.github/actions/verify-basic-requirements

      - name: Verify podman heredoc support
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cat > "${dir}/Containerfile" <<'CEOF'
          FROM docker.io/library/alpine:latest
          RUN <<EOF
          echo "heredoc works" > /heredoc-test.txt
          EOF
          CEOF
          podman build -t localhost/heredoc-test:latest -f "${dir}/Containerfile" "${dir}"
          result="$(podman run --rm localhost/heredoc-test:latest cat /heredoc-test.txt)"
          test "${result}" = "heredoc works"

      # bwrap is not confined by the bwrap-userns-restrict profile on the
      # 24.04 runners, so there is no transition to check there.
      - name: Verify bwrap AppArmor transition
        if: matrix.runner == 'ubuntu-26.04'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3m \
            podman run --rm -i --cap-add=all \
              --security-opt=label=type:container_runtime_t --device /dev/fuse \
              quay.io/centos-bootc/centos-bootc:stream9 bash -euxo pipefail <<'CONTAINER'
          mkdir /bwrap-tmp
          touch /bwrap-tmp/parent
          chown 1:1 /bwrap-tmp/parent
          bwrap --bind / / --proc /proc --dev /dev /bin/bash -euxo pipefail -c '
            label=$(cat /proc/self/attr/current)
            test "$label" = "bwrap (enforce)"
            touch /bwrap-tmp/child
            chown 1:1 /bwrap-tmp/child
            test "$(stat -c %u:%g /bwrap-tmp/child)" = 1:1
          '
          CONTAINER

  test-bootc-ubuntu-setup-compatibility:
    name: Test bootc-ubuntu-setup compatibility entry point
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./bootc-ubuntu-setup
      - env:
          HOST_OS: ${{ steps.setup.outputs.host-os }}
        run: |
          test -n "$ARCH"
          test "$HOST_OS" = ubuntu-24.04

  test-bootc-host-setup-rhel10:
    name: Test bootc-host-setup (RHEL 10)
    runs-on: rhel10-x86_64-16c-64g
    steps:
      - uses: actions/checkout@v7
      - uses: ./bootc-host-setup
        with:
          libvirt: 'true'
      - run: |
          rustc --version
          cargo --version
          test "$(getenforce)" = Enforcing

  test-bootc-host-setup-scripts:
    name: Test bootc-host-setup scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash test/bootc-host-setup.sh

  test-setup-rust:
    name: Test setup-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run setup-rust
        uses: ./setup-rust

      - name: Verify setup
        run: |
          rustc --version
          cargo --version
          cargo nextest --version

  test-openssf-scorecard:
    name: Test openssf-scorecard
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run openssf-scorecard
        uses: ./openssf-scorecard
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.sha }}

  test-build-push-image:
    name: Test build-push-image (build only)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup host
        uses: ./bootc-host-setup

      - name: Create test Containerfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-ctx
          echo 'FROM docker.io/library/alpine:latest' > /tmp/test-ctx/Containerfile
          echo 'RUN echo hello > /hello.txt' >> /tmp/test-ctx/Containerfile

      - name: Run build-push-image (push=false)
        id: build
        uses: ./build-push-image
        with:
          image: ghcr.io/bootc-dev/actions-test
          arch: amd64
          containerfile: /tmp/test-ctx/Containerfile
          context: /tmp/test-ctx
          push: 'false'

      - name: Verify image was built
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.build.outputs.local-image }}
        run: |
          set -euo pipefail
          test -n "${LOCAL_IMAGE}"
          podman inspect "${LOCAL_IMAGE}"
          result="$(podman run --rm "${LOCAL_IMAGE}" cat /hello.txt)"
          test "${result}" = "hello"

  test-build-push-image-local:
    name: Test build-push-image with local-image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup host
        uses: ./bootc-host-setup

      - name: Build image manually
        shell: bash
        run: |
          set -euo pipefail
          echo 'FROM docker.io/library/alpine:latest' > /tmp/Containerfile
          echo 'RUN echo custom > /custom.txt' >> /tmp/Containerfile
          podman build -t localhost/my-custom-image:latest -f /tmp/Containerfile /tmp

      - name: Run build-push-image with pre-built image (push=false)
        id: build
        uses: ./build-push-image
        with:
          image: ghcr.io/bootc-dev/actions-test
          arch: amd64
          local-image: localhost/my-custom-image:latest
          push: 'false'

      - name: Verify correct image was used
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.build.outputs.local-image }}
        run: |
          set -euo pipefail
          test "${LOCAL_IMAGE}" = "localhost/my-custom-image:latest"
          result="$(podman run --rm "${LOCAL_IMAGE}" cat /custom.txt)"
          test "${result}" = "custom"
