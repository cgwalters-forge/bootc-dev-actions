name: Test actions (PR)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-bootc-ubuntu-setup:
    name: Test bootc-ubuntu-setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run bootc-ubuntu-setup
        uses: ./bootc-ubuntu-setup

      - name: Verify setup
        run: |
          podman --version
          just --version
          test -n "$ARCH"

  test-setup-rust:
    name: Test setup-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run setup-rust
        uses: ./setup-rust

      - name: Verify setup
        run: |
          rustc --version
          cargo --version
          cargo nextest --version

  test-openssf-scorecard:
    name: Test openssf-scorecard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run openssf-scorecard
        uses: ./openssf-scorecard
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.sha }}

  test-build-push-image:
    name: Test build-push-image (build only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup host
        uses: ./bootc-ubuntu-setup

      - name: Create test Containerfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-ctx
          echo 'FROM docker.io/library/alpine:latest' > /tmp/test-ctx/Containerfile
          echo 'RUN echo hello > /hello.txt' >> /tmp/test-ctx/Containerfile

      - name: Run build-push-image (push=false)
        id: build
        uses: ./build-push-image
        with:
          image: ghcr.io/bootc-dev/actions-test
          arch: amd64
          containerfile: /tmp/test-ctx/Containerfile
          context: /tmp/test-ctx
          push: 'false'

      - name: Verify image was built
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.build.outputs.local-image }}
        run: |
          set -euo pipefail
          test -n "${LOCAL_IMAGE}"
          podman inspect "${LOCAL_IMAGE}"
          result="$(podman run --rm "${LOCAL_IMAGE}" cat /hello.txt)"
          test "${result}" = "hello"

  test-build-push-image-local:
    name: Test build-push-image with local-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup host
        uses: ./bootc-ubuntu-setup

      - name: Build image manually
        shell: bash
        run: |
          set -euo pipefail
          echo 'FROM docker.io/library/alpine:latest' > /tmp/Containerfile
          echo 'RUN echo custom > /custom.txt' >> /tmp/Containerfile
          podman build -t localhost/my-custom-image:latest -f /tmp/Containerfile /tmp

      - name: Run build-push-image with pre-built image (push=false)
        id: build
        uses: ./build-push-image
        with:
          image: ghcr.io/bootc-dev/actions-test
          arch: amd64
          local-image: localhost/my-custom-image:latest
          push: 'false'

      - name: Verify correct image was used
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.build.outputs.local-image }}
        run: |
          set -euo pipefail
          test "${LOCAL_IMAGE}" = "localhost/my-custom-image:latest"
          result="$(podman run --rm "${LOCAL_IMAGE}" cat /custom.txt)"
          test "${result}" = "custom"

  test-bootc-ubuntu-setup-libvirt-qemu:
    name: Test bootc-ubuntu-setup patched QEMU (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu: qemu-system-x86_64
            machine: q35
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: qemu-system-aarch64
            machine: virt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run bootc-ubuntu-setup with libvirt
        uses: ./bootc-ubuntu-setup
        with:
          libvirt: 'true'

      - name: Verify selected QEMU
        shell: bash
        run: |
          set -euo pipefail
          qemu=/usr/bin/${{ matrix.qemu }}
          test -x "${qemu}"
          sha256sum "${qemu}"
          version_line=
          while IFS= read -r line; do version_line="${line}"; break; done < <("${qemu}" --version)
          test "${version_line}" = 'QEMU emulator version 9.2.1'
          "${qemu}" -machine help | grep -q '^${{ matrix.machine }} '
          "${qemu}" -device vhost-user-fs-pci,help >/dev/null
          smoke_dir=$(mktemp -d)
          timeout 10 "${qemu}" -machine none -nodefaults -display none -S \
            -netdev user,id=net0 \
            -qmp "unix:${smoke_dir}/qmp.sock,server=on,wait=off" >/dev/null 2>&1 &
          smoke_pid=$!
          sleep 1
          kill -0 "${smoke_pid}"
          kill "${smoke_pid}"
          set +e
          wait "${smoke_pid}"
          smoke_status=$?
          set -e
          rm -rf "${smoke_dir}"
          test "${smoke_status}" -eq 0 -o "${smoke_status}" -eq 143
