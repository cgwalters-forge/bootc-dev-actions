name: Test published actions
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-bootc-host-setup:
    name: Test bootc-host-setup@main (${{ matrix.runner }})
    # See test-actions-pr.yml for why this is a matrix.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Run bootc-host-setup
        uses: bootc-dev/actions/bootc-host-setup@main

      - name: Verify setup
        run: |
          just --version
          test -n "$ARCH"

      - name: Verify basic requirements
        uses: bootc-dev/actions/.github/actions/verify-basic-requirements@main

  test-setup-rust:
    name: Test setup-rust@main
    runs-on: ubuntu-latest
    steps:
      - name: Run setup-rust
        uses: bootc-dev/actions/setup-rust@main

      - name: Verify setup
        run: |
          rustc --version
          cargo --version
          cargo nextest --version

  test-openssf-scorecard:
    name: Test openssf-scorecard@main
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run openssf-scorecard
        uses: bootc-dev/actions/openssf-scorecard@main
        with:
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
