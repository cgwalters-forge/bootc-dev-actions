name: 'Bootc Ubuntu Setup'
description: 'Default host setup'
inputs:
  libvirt:
    description: 'Install libvirt and virtualization stack'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # The default runners have TONS of crud on them...
    - name: Free up disk space on runner
      shell: bash
      run: |
        set -xeuo pipefail
        sudo df -h
        # Use globs for package patterns (apt and dpkg both support fnmatch globs)
        unwanted_pkgs=('aspnetcore-*' 'dotnet-*' 'llvm-*' 'php*' 'mongodb-*' 'mysql-*'
                       azure-cli google-chrome-stable firefox mono-devel)
        unwanted_dirs=(/usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL)
        # Start background removal operations as systemd units; if this causes
        # races in the future around disk space we can look at waiting for cleanup
        # before starting further jobs, but right now we spent a lot of time waiting
        # on the network and scripts and such below, giving these plenty of time to run.
        n=0
        runcleanup() {
          sudo systemd-run -r -u action-cleanup-${n} -- "$@"
          n=$(($n + 1))
        }
        runcleanup docker image prune --all --force
        for x in ${unwanted_dirs[@]}; do
          runcleanup rm -rf "$x"
        done
        # Apt removals in foreground, as we can't parallelize these.
        # Only attempt removal if matching packages are installed.
        for x in ${unwanted_pkgs[@]}; do
          if dpkg -l "$x" >/dev/null 2>&1; then
            /bin/time -f '%E %C' sudo apt-get remove -y "$x"
          fi
        done
    # We really want support for heredocs
    - name: Update podman and install just
      shell: bash
      run: |
        set -eux
        # Require the runner is ubuntu-24.04
        IDV=$(. /usr/lib/os-release && echo ${ID}-${VERSION_ID})
        test "${IDV}" = "ubuntu-24.04"
        # plucky is the next release. Historically we pointed straight at
        # azure.archive.ubuntu.com, but that single Azure-regional mirror suffers
        # chronic connection timeouts on GitHub Actions runners. This is a
        # widespread, long-standing issue, not specific to us:
        # https://github.com/actions/runner-images/issues/7048
        # https://github.com/actions/runner-images/issues/12949
        # https://github.com/orgs/community/discussions/205332
        # A plain http(s) URL is a single endpoint as far as apt is concerned: if
        # it's unreachable, apt just retries the *same* host rather than trying an
        # alternative (only the mirror:/mirror+file: URI scheme gives apt genuine
        # client-side fallback across multiple mirrors, per sources.list(5)). So
        # reuse the mirrorlist-with-fallback that Ubuntu's own cloud-init already
        # sets up for the base OS sources on these runners (Azure mirror first,
        # falling back to the global archive), instead of hardcoding one host with
        # no fallback at all. Fall back to the plain global archive if that
        # mirrorlist isn't present, e.g. on a non-standard runner.
        # Non-amd64 architectures (e.g. arm64) use ports.ubuntu.com/ubuntu-ports,
        # which isn't affected by this since it has no azure-specific variant.
        if [ "$(dpkg --print-architecture)" = "amd64" ]; then
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            mirror="mirror+file:/etc/apt/apt-mirrors.txt"
          else
            mirror="http://archive.ubuntu.com/ubuntu"
          fi
        else
          mirror="http://ports.ubuntu.com/ubuntu-ports"
        fi
        echo "deb ${mirror} plucky universe main" | sudo tee /etc/apt/sources.list.d/plucky.list
        # Raise apt retries slightly above the compiled-in default of 3 to tolerate
        # transient network blips (covers ~2-3 min of cumulative retry delay with
        # apt's exponential backoff, capped at 30s/attempt). This used to be set to
        # 35 (~15 min) specifically to ride out azure.archive.ubuntu.com outages;
        # now that we no longer use that mirror, a much smaller value suffices.
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
        /bin/time -f '%E %C' sudo apt update
        # skopeo is currently older in plucky for some reason hence --allow-downgrades
        /bin/time -f '%E %C' sudo apt install -y --allow-downgrades crun/plucky buildah/plucky podman/plucky skopeo/plucky just
    # This is the default on e.g. Fedora derivatives, but not Debian.
    # Only needed when libvirt/virtualization is requested.
    - name: Enable unprivileged /dev/kvm access
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      run: |
        set -xeuo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm
    # Used by a few workflows, but generally useful
    - name: Set architecture variable
      id: set_arch
      shell: bash
      run: echo "ARCH=$(arch)" >> $GITHUB_ENV
    # Install libvirt stack if requested
    - name: Install libvirt and virtualization stack
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      run: |
        set -xeuo pipefail
        # renovate: datasource=github-releases depName=bootc-dev/bcvk
        export BCVK_VERSION=0.19.0
        # see https://github.com/bootc-dev/bcvk/issues/176
        /bin/time -f '%E %C' sudo apt install -y curl git gcc make libkrb5-dev pkg-config libvirt-dev genisoimage qemu-utils qemu-kvm virtiofsd libvirt-daemon-system python3-virt-firmware \
          libglib2.0-dev libpixman-1-dev libslirp-dev ninja-build python3-venv libfdt-dev \
          zlib1g-dev libcap-ng-dev libattr1-dev libseccomp-dev liburing-dev libaio-dev \
          libnuma-dev libfuse3-dev libgnutls28-dev libcap-dev bzip2 xz-utils
        case "$(dpkg --print-architecture)" in
          amd64) qemu_pkg=qemu-system-x86 ;;
          arm64) qemu_pkg=qemu-system-arm ;;
          *) echo "Unsupported QEMU host architecture" >&2; exit 1 ;;
        esac
        qemu_version=$(dpkg-query -W -f='${Version}' "${qemu_pkg}")
        test "${qemu_version}" = '1:9.2.1+ds-1ubuntu5' || {
          echo "Unexpected ${qemu_pkg} version ${qemu_version}; expected the known Plucky 9.2.1 package" >&2
          exit 1
        }
        echo "QEMU_TOOLCHAIN_FINGERPRINT=$(gcc -dumpfullversion -dumpmachine)" >> "$GITHUB_ENV"
    - name: Cache patched native QEMU
      if: ${{ inputs.libvirt == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/bootc-qemu
        key: ubuntu-24.04-${{ runner.arch }}-${{ env.QEMU_TOOLCHAIN_FINGERPRINT }}-qemu-9.2.1-cac3fb4414778eab741a5e58ca0a30f1edc9528a-6da6ac4782d3e643abf94c23b39e8cd18a538ad12e83bbd083ed5adc033f467d-config-native-system-kvm-slirp-nomodules-prefix-usr-v3
    - name: Build and select patched native QEMU
      if: ${{ inputs.libvirt == 'true' }}
      shell: bash
      run: |
        set -xeuo pipefail
        export BCVK_VERSION=0.19.0
        # Ubuntu 24.04 currently gets QEMU 9.2.1 from the temporary Plucky source
        # above.  Build only its native system binary with the upstream vhost-user
        # race fix. Install it over the package binary because stock bcvk 0.19
        # does not receive QEMU_BIN from this composite action's environment.
        bash "${GITHUB_ACTION_PATH}/build-qemu.sh" --test-architecture-mapping
        /bin/time -f '%E %C' bash "${GITHUB_ACTION_PATH}/build-qemu.sh"
        # Something in the stack is overriding this, but we want session right now for bcvk
        echo LIBVIRT_DEFAULT_URI=qemu:///session >> $GITHUB_ENV
        td=$(mktemp -d)
        cd $td
        # Install bcvk
        target=bcvk-$(arch)-unknown-linux-gnu
        /bin/time -f '%E %C' curl --retry 35 --retry-delay 30 --retry-max-time 1200 -LO https://github.com/bootc-dev/bcvk/releases/download/v${BCVK_VERSION}/${target}.tar.gz
        tar xzf ${target}.tar.gz
        sudo install -T ${target} /usr/bin/bcvk
        cd -
        rm -rf "$td"

        # Also bump the default fd limit as a workaround for https://github.com/bootc-dev/bcvk/issues/65
        sudo sed -i -e 's,^\* hard nofile 65536,* hard nofile 524288,' /etc/security/limits.conf
    - name: Cleanup status
      shell: bash
      run: |
        set -xeuo pipefail
        systemctl list-units 'action-cleanup*'
        df -h
